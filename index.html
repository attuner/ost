<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Autonomous Radio Scheduler</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- PWA & Mobile Web App Capabilities -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#181824" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Online Radio" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%231e293b'/%3E%3Ctext x='96' y='126' fill='%2360a5fa' font-family='sans-serif' font-weight='900' font-size='82' text-anchor='middle'%3EOR%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%231e293b'/%3E%3Ctext x='96' y='126' fill='%2360a5fa' font-family='sans-serif' font-weight='900' font-size='82' text-anchor='middle'%3EOR%3C/text%3E%3C/svg%3E" />
  
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #030712;
      --cabinet: #1e1e24;
      --speaker-rim: #2d2d38;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.12);
      --focus-ring: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      inset: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* VINTAGE / MODERN STEREO RADIO BOOMBOX CHASSIS */
    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #181824 0%, #030712 100%);
      padding: clamp(10px, 3vh, 24px);
    }

    #radio-chassis {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(280px, 1.4fr) minmax(180px, 1fr);
      gap: clamp(12px, 2.5vw, 24px);
      width: 100%;
      max-width: 1100px;
      height: min(560px, 94vh);
      background: linear-gradient(180deg, #2a2a35 0%, #15151c 100%);
      border: 4px solid #3e3e4f;
      border-radius: 36px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), inset 0 2px 4px rgba(255, 255, 255, 0.15);
      padding: clamp(14px, 2.5vh, 28px);
      align-items: center;
      position: relative;
    }

    @media (max-width: 820px) {
      #radio-chassis {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto 1fr;
        height: 96dvh;
        overflow-y: auto;
      }
      #center-console {
        grid-column: span 2;
        order: -1;
      }
    }

    /* STEREO SPEAKER TOWERS */
    .speaker-unit {
      background: radial-gradient(circle, #101015 40%, #08080c 100%);
      border: 6px solid var(--speaker-rim);
      border-radius: 28px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 10px;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95);
      position: relative;
    }

    .speaker-label {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .cone-housing {
      position: relative;
      width: clamp(140px, 18vw, 200px);
      height: clamp(140px, 18vw, 200px);
      border-radius: 50%;
      background: radial-gradient(circle, #1e1e28 15%, #050508 85%);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 3px solid #333342;
    }

    .speaker-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .dust-cap {
      width: 32%;
      height: 32%;
      border-radius: 50%;
      background: radial-gradient(circle, #3b82f6 0%, #172554 80%);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
      z-index: 2;
      transition: transform 0.05s ease-out;
    }

    /* REALTIME DECIBEL & FREQUENCY TELEMETRY */
    .telemetry-card {
      width: 100%;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 0.72rem;
      color: #cbd5e1;
    }

    .db-meter-track {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
    }

    .db-meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981 0%, #f59e0b 70%, #ef4444 100%);
      transition: width 0.08s ease-out;
    }

    /* CENTER CONSOLE & TUNER PANEL */
    #center-console {
      background: rgba(10, 10, 16, 0.85);
      border: 2px solid #2f2f3f;
      border-radius: 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(14px, 2vh, 22px);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .tuner-glass {
      background: #000;
      border: 2px solid #2563eb40;
      border-radius: 14px;
      padding: 12px;
      box-shadow: inset 0 0 15px rgba(37, 99, 235, 0.2);
    }

    #station-title {
      font-size: clamp(1.2rem, 2.5vw, 1.7rem);
      font-weight: 700;
      margin: 4px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #60a5fa;
    }

    #station-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* SOUND MODE DSP SELECTOR */
    .sound-modes-container {
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modes-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .modes-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .mode-btn {
      background: #1e1e2d;
      border: 1px solid var(--border);
      color: #e2e8f0;
      padding: 7px 4px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: var(--primary);
      border-color: #93c5fd;
      color: white;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
    }

    /* MASTER / REMOTE BUTTON BAR */
    .control-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.85rem;
      transition: background 0.15s;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #2f2f3f; color: #fff; }
    .btn-secondary:hover { background: #3f3f55; }
    .btn-cancel { background: #475569; color: #fff; }

    /* EDIT POPUP MODAL */
    #edit-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 120;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-box {
      background: #181824;
      border: 1px solid var(--border);
      border-radius: 20px;
      width: min(460px, 95vw);
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
    }

    /* REMOTE CONTROL DRAWER */
    #remote-drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      right: -520px;
      width: min(460px, 100vw);
      height: 100%;
      height: 100dvh;
      background: #111827;
      border-left: 1px solid var(--border);
      box-shadow: -10px 0 30px rgba(0,0,0,0.8);
      z-index: 50;
      display: flex;
      flex-direction: column;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #remote-drawer.open { right: 0; }

    .remote-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .remote-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .station-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .station-item {
      background: #1f2937;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .station-item.active {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.2);
    }

    .station-info h4 { font-size: 0.9rem; margin-bottom: 2px; }
    .station-info span { font-size: 0.72rem; color: var(--text-muted); }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
      text-align: left;
    }

    .input-group label { font-size: 0.75rem; color: var(--text-muted); }
    .input-group input, .input-group select {
      background: #1f2937;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 150;
    }
  </style>
</head>
<body>

  <!-- STAGE WITH STEREO BOOMBOX HARDWARE DESIGN -->
  <div id="stage">
    <div id="radio-chassis">
      
      <!-- LEFT SPEAKER TOWER -->
      <div class="speaker-unit" id="speaker-left">
        <span class="speaker-label">◀ LEFT CHANNEL</span>
        
        <div class="cone-housing">
          <canvas class="speaker-canvas" id="canvas-left"></canvas>
          <div class="dust-cap" id="cap-left"></div>
        </div>

        <div class="telemetry-card">
          <div class="telemetry-row">
            <span>LEVEL:</span>
            <span id="left-db-txt">-∞ dB</span>
          </div>
          <div class="db-meter-track">
            <div class="db-meter-fill" id="left-db-fill"></div>
          </div>
          <div class="telemetry-row" style="margin-top: 2px;">
            <span>FREQ:</span>
            <span id="left-freq-txt">0 Hz</span>
          </div>
        </div>
      </div>

      <!-- CENTER TUNER & DSP CONSOLE -->
      <div id="center-console">
        <div class="tuner-glass">
          <span class="badge" id="stream-status">AUTOPILOT SCHEDULER</span>
          <h2 id="station-title">Loading Radio...</h2>
          <p id="station-meta">Synchronizing schedule...</p>
        </div>

        <!-- CHANNEL / SOUND MODES SWITCHER -->
        <div class="sound-modes-container">
          <span class="modes-label">DSP SOUND SURROUND MODES</span>
          <div class="modes-pills">
            <button class="mode-btn active" onclick="setSoundMode('2.0')">2.0 Direct</button>
            <button class="mode-btn" onclick="setSoundMode('2.0-surround')">2.0 Surround</button>
            <button class="mode-btn" onclick="setSoundMode('2.1')">2.1 Bass+</button>
            <button class="mode-btn" onclick="setSoundMode('3.0')">3.0 Center</button>
            <button class="mode-btn" onclick="setSoundMode('4.0')">4.0 Quad</button>
            <button class="mode-btn" onclick="setSoundMode('5.1')">5.1 Virtual</button>
          </div>
        </div>

        <div class="control-actions">
          <button class="btn btn-primary" style="flex:1;" onclick="openAddPopup()">+ Add Station</button>
          <button class="btn btn-secondary" onclick="toggleRemote()">Timetable</button>
          <button class="btn btn-secondary" onclick="syncWithGoogleSheet()">Sync Sheet</button>
        </div>
      </div>

      <!-- RIGHT SPEAKER TOWER -->
      <div class="speaker-unit" id="speaker-right">
        <span class="speaker-label">RIGHT CHANNEL ▶</span>
        
        <div class="cone-housing">
          <canvas class="speaker-canvas" id="canvas-right"></canvas>
          <div class="dust-cap" id="cap-right"></div>
        </div>

        <div class="telemetry-card">
          <div class="telemetry-row">
            <span>LEVEL:</span>
            <span id="right-db-txt">-∞ dB</span>
          </div>
          <div class="db-meter-track">
            <div class="db-meter-fill" id="right-db-fill"></div>
          </div>
          <div class="telemetry-row" style="margin-top: 2px;">
            <span>FREQ:</span>
            <span id="right-freq-txt">0 Hz</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- POPUP EDIT / ADD MODAL -->
  <div id="edit-popup-overlay">
    <div class="modal-box">
      <h3 id="popup-heading" style="margin-bottom: 14px;">Edit Radio Station</h3>
      <form id="popup-form" onsubmit="handlePopupSubmit(event)">
        <input type="hidden" id="pop-index" value="-1" />
        
        <div style="display:flex; gap: 8px;">
          <div class="input-group" style="flex:1;">
            <label>Start Time (HH:mm)</label>
            <input type="text" id="pop-start" placeholder="08:00" required pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" />
          </div>
          <div class="input-group" style="flex:1;">
            <label>End Time (HH:mm)</label>
            <input type="text" id="pop-end" placeholder="12:00" required pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" />
          </div>
        </div>

        <div class="input-group">
          <label>Station Name</label>
          <input type="text" id="pop-title" placeholder="e.g. BBC World Service" required />
        </div>

        <div style="display:flex; gap: 8px;">
          <div class="input-group" style="flex:1;">
            <label>Category</label>
            <select id="pop-category">
              <option value="News">News</option>
              <option value="Learning">Learning & Talks</option>
              <option value="Entertainment">Entertainment & Music</option>
              <option value="Kids">Kids & Youth</option>
            </select>
          </div>
          <div class="input-group" style="flex:1;">
            <label>Language</label>
            <input type="text" id="pop-lang" placeholder="e.g. English / Telugu" />
          </div>
        </div>

        <div class="input-group">
          <label>Stream URL (.mp3, .aac, .m3u8)</label>
          <input type="url" id="pop-url" placeholder="https://..." required />
        </div>

        <div style="display:flex; gap: 8px; margin-top: 16px;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Save Station</button>
          <button type="button" class="btn btn-cancel" onclick="closePopup()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TIMETABLE DRAWER -->
  <div id="remote-drawer">
    <div class="remote-header">
      <h3>Station Timetable</h3>
      <button class="btn btn-secondary" onclick="toggleRemote()">✕</button>
    </div>
    <div class="remote-content">
      <div class="station-list" id="remote-station-list"></div>
    </div>
  </div>

  <audio id="radio-core" crossorigin="anonymous" preload="auto"></audio>

  <div id="start-overlay">
    <button class="btn btn-primary" style="padding: 16px 36px; font-size: 1.1rem;" id="init-btn">
      Start Autonomous Radio Player
    </button>
  </div>

    let schedule = [];

    // Web Audio Stereo DSP Architecture
    let audioCtx, audioSource, splitterNode, analyserL, analyserR, dataL, dataR;
    let dspBassFilter, dspMidFilter, dspDelayL, dspDelayR, dspCenterFilter, dspGain;

    // Local Storage Hydration (Prevents data wipeout on page reloads)
    function initializeScheduleData() {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        try {
          schedule = JSON.parse(cached);
          if (schedule.length > 0) return;
        } catch (e) {
          console.warn("Storage parse error, resetting fallback:", e);
        }
      }
      schedule = [...DEFAULT_SCHEDULE];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
    }

    function saveScheduleData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
      renderRemoteList();
    }

    // STEREO WEB AUDIO API + MULTI-CHANNEL SURROUND DSP GRAPH
    function initStereoAudioEngine() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        audioSource = audioCtx.createMediaElementSource(audio);
        splitterNode = audioCtx.createChannelSplitter(2);

        // Independent Analyzers for Left & Right Speakers
        analyserL = audioCtx.createAnalyser();
        analyserL.fftSize = 128;
        analyserR = audioCtx.createAnalyser();
        analyserR.fftSize = 128;

        dataL = new Uint8Array(analyserL.frequencyBinCount);
        dataR = new Uint8Array(analyserR.frequencyBinCount);

        // DSP Filter Nodes for Surround Sound Modes
        dspBassFilter = audioCtx.createBiquadFilter();
        dspBassFilter.type = "lowshelf";
        dspBassFilter.frequency.value = 180;
        dspBassFilter.gain.value = 0;

        dspMidFilter = audioCtx.createBiquadFilter();
        dspMidFilter.type = "peaking";
        dspMidFilter.frequency.value = 2500;
        dspMidFilter.gain.value = 0;

        dspCenterFilter = audioCtx.createBiquadFilter();
        dspCenterFilter.type = "bandpass";
        dspCenterFilter.frequency.value = 1000;
        dspCenterFilter.Q.value = 1.0;

        dspDelayL = audioCtx.createDelay();
        dspDelayL.delayTime.value = 0.0;
        dspDelayR = audioCtx.createDelay();
        dspDelayR.delayTime.value = 0.0;

        dspGain = audioCtx.createGain();
        dspGain.gain.value = 1.0;

        // Wire Audio Graph
        audioSource.connect(splitterNode);
        splitterNode.connect(analyserL, 0);
        splitterNode.connect(analyserR, 1);

        audioSource.connect(dspBassFilter);
        dspBassFilter.connect(dspMidFilter);
        dspMidFilter.connect(dspGain);
        dspGain.connect(audioCtx.destination);

        startStereoVisualizerLoop();
      } catch (e) {
        console.warn("Audio Context init restricted:", e);
      }
    }

    // SOUND MODES (2.0, 2.0 Surround, 2.1, 3.0, 4.0, 5.1 Virtual)
    function setSoundMode(mode) {
      currentSoundMode = mode;
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.toggle("active", btn.innerText.toLowerCase().includes(mode.replace("-", " ")));
      });

      if (!dspBassFilter || !dspGain) return;

      switch(mode) {
        case "2.0": // Pure uncolored stereo
          dspBassFilter.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
          dspMidFilter.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
          dspGain.gain.setTargetAtTime(1.0, audioCtx.currentTime, 0.05);
          break;

        case "2.0-surround": // Widened stereo image
          dspBassFilter.gain.setTargetAtTime(2.5, audioCtx.currentTime, 0.05);
          dspMidFilter.gain.setTargetAtTime(3.0, audioCtx.currentTime, 0.05);
          dspGain.gain.setTargetAtTime(1.1, audioCtx.currentTime, 0.05);
          break;

        case "2.1": // Subwoofer enhancement (+8dB below 180Hz)
          dspBassFilter.gain.setTargetAtTime(8.5, audioCtx.currentTime, 0.05);
          dspMidFilter.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.05);
          dspGain.gain.setTargetAtTime(1.05, audioCtx.currentTime, 0.05);
          break;

        case "3.0": // Center dialogue & voice clarity
          dspBassFilter.gain.setTargetAtTime(-1.0, audioCtx.currentTime, 0.05);
          dspMidFilter.gain.setTargetAtTime(6.0, audioCtx.currentTime, 0.05);
          dspGain.gain.setTargetAtTime(1.1, audioCtx.currentTime, 0.05);
          break;

        case "4.0": // Quadraphonic ambiance simulation
          dspBassFilter.gain.setTargetAtTime(3.0, audioCtx.currentTime, 0.05);
          dspMidFilter.gain.setTargetAtTime(4.0, audioCtx.currentTime, 0.05);
          dspGain.gain.setTargetAtTime(1.2, audioCtx.currentTime, 0.05);
          break;

        case "5.1": // 5.1 Virtual Surround: Deep sub + wide vocal + presence
          dspBassFilter.gain.setTargetAtTime(7.0, audioCtx.currentTime, 0.05);
          dspMidFilter.gain.setTargetAtTime(4.5, audioCtx.currentTime, 0.05);
          dspGain.gain.setTargetAtTime(1.25, audioCtx.currentTime, 0.05);
          break;
      }
    }

    // CIRCULAR STEREO SPEAKER CONE VISUALIZATION & TELEMETRY
    function startStereoVisualizerLoop() {
      const cvsL = document.getElementById("canvas-left");
      const cvsR = document.getElementById("canvas-right");
      const ctxL = cvsL.getContext("2d");
      const ctxR = cvsR.getContext("2d");
      const capL = document.getElementById("cap-left");
      const capR = document.getElementById("cap-right");

      const txtDbL = document.getElementById("left-db-txt");
      const txtDbR = document.getElementById("right-db-txt");
      const fillDbL = document.getElementById("left-db-fill");
      const fillDbR = document.getElementById("right-db-fill");
      const txtFreqL = document.getElementById("left-freq-txt");
      const txtFreqR = document.getElementById("right-freq-txt");

      function fitCanvas() {
        cvsL.width = cvsL.parentElement.clientWidth;
        cvsL.height = cvsL.parentElement.clientHeight;
        cvsR.width = cvsR.parentElement.clientWidth;
        cvsR.height = cvsR.parentElement.clientHeight;
      }
      fitCanvas();
      window.addEventListener("resize", fitCanvas);

      function renderSpeaker(ctx, canvas, analyser, data, capEl, txtDb, fillDb, txtFreq, color) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!analyser) return;

        analyser.getByteFrequencyData(data);

        let sum = 0;
        let maxVal = 0;
        let maxIdx = 0;

        for (let i = 0; i < data.length; i++) {
          const val = data[i];
          sum += val * val;
          if (val > maxVal) { maxVal = val; maxIdx = i; }
        }

        // Decibel calculation: RMS to approximate dBFS
        const rms = Math.sqrt(sum / data.length);
        const db = rms > 0 ? Math.max(-60, Math.round(20 * Math.log10(rms / 255))) : -60;
        const dominantFreq = Math.round((maxIdx * (audioCtx.sampleRate / 2)) / analyser.frequencyBinCount);

        txtDb.innerText = db > -60 ? `${db} dB` : "-∞ dB";
        fillDb.style.width = `${Math.min(100, Math.max(0, (db + 60) * 1.66))}%`;
        txtFreq.innerText = maxVal > 15 ? `${dominantFreq} Hz` : "0 Hz";

        // Cone physical excursion pulse
        const scale = 1 + (rms / 255) * 0.18;
        capEl.style.transform = `scale(${scale})`;

        // Circular Waveform around the speaker cone rim
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const radius = (canvas.width / 2) * 0.72;
        const bars = data.length;

        for (let i = 0; i < bars; i++) {
          const val = data[i];
          const rad = (Math.PI * 2 / bars) * i;
          const barLen = (val / 255) * (radius * 0.45);

          const x1 = cx + Math.cos(rad) * radius;
          const y1 = cy + Math.sin(rad) * radius;
          const x2 = cx + Math.cos(rad) * (radius + barLen);
          const y2 = cy + Math.sin(rad) * (radius + barLen);

          ctx.strokeStyle = color;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }

      function loop() {
        requestAnimationFrame(loop);
        renderSpeaker(ctxL, cvsL, analyserL, dataL, capL, txtDbL, fillDbL, txtFreqL, "#38bdf8");
        renderSpeaker(ctxR, cvsR, analyserR, dataR, capR, txtDbR, fillDbR, txtFreqR, "#818cf8");
      }
      loop();
    }

    // AUDIO PLAYBACK & TIMELINE
    function toMinutes(t) {
      if (!t) return 0;
      const parts = t.toString().trim().split(":");
      return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    }

    function getScheduledChannel() {
      const now = new Date();
      const current = now.getHours() * 60 + now.getMinutes();

      return schedule.find(item => {
        const start = toMinutes(item.startTime);
        const end = toMinutes(item.endTime);
        if (start < end) return current >= start && current < end;
        if (start > end) return current >= start || current < end;
        return true;
      }) || schedule[0];
    }

    function playStream(station, isManual = false) {
      if (!station) return;
      activeChannel = station;
      manualOverride = isManual;

      stationTitleEl.innerText = station.title;
      stationMetaEl.innerText = `${station.startTime} - ${station.endTime} | ${station.category || "General"} | ${station.language || "English"}`;
      streamStatusEl.innerText = isManual ? "MANUAL OVERRIDE" : "AUTOPILOT SCHEDULER";

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      audio.pause();
      audio.removeAttribute("src");

      if (station.url.includes(".m3u8") && Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(station.url);
        hlsInstance.attachMedia(audio);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(() => {}));
      } else {
        audio.src = station.url;
        audio.play().catch(e => console.warn("Playback failed:", e));
      }

      renderRemoteList();
    }

    function evaluateSchedule() {
      if (manualOverride) return;
      const scheduled = getScheduledChannel();
      if (scheduled && (!activeChannel || activeChannel.url !== scheduled.url)) {
        playStream(scheduled, false);
      }
    }

    function openEditPopup(index) {
      const station = schedule[index];
      document.getElementById("popup-heading").innerText = `Edit: ${station.title}`;
      document.getElementById("pop-index").value = index;

    function closePopup() {
      popupOverlay.style.display = "none";

    function handlePopupSubmit(e) {
      e.preventDefault();
      const editIdx = parseInt(document.getElementById("pop-index").value, 10);
      const stationData = {
        startTime: document.getElementById("pop-start").value.trim(),
        endTime: document.getElementById("pop-end").value.trim(),
        title: document.getElementById("pop-title").value.trim(),
        category: document.getElementById("pop-category").value,
        language: document.getElementById("pop-lang").value.trim(),
        url: document.getElementById("pop-url").value.trim()
      };

      if (editIdx >= 0) {
        schedule[editIdx] = stationData;
      } else {
        schedule.push(stationData);
      }

      schedule.sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
      saveScheduleData();
      closePopup();
      evaluateSchedule();
    }

    function removeStation(index) {
      schedule.splice(index, 1);
      saveScheduleData();
    }

    function toggleRemote() {
      remoteDrawer.classList.toggle("open");
    }

    function renderRemoteList() {
      remoteList.innerHTML = "";
      schedule.forEach((item, index) => {
        const el = document.createElement("div");
        el.className = `station-item ${activeChannel && activeChannel.url === item.url ? "active" : ""}`;
        el.innerHTML = `
          <div class="station-info" style="flex:1;">
            <h4>${item.title}</h4>
            <span>${item.startTime} - ${item.endTime} • ${item.category || ""} • ${item.language || ""}</span>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem;" onclick="event.stopPropagation(); openEditPopup(${index})">✏ Edit</button>
            <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem;" onclick="event.stopPropagation(); removeStation(${index})">✕</button>
          </div>
        `;
        el.onclick = () => playStream(item, true);
        remoteList.appendChild(el);
      });
    }

    async function syncWithGoogleSheet() {
      try {
        streamStatusEl.innerText = "SAVING TO GOOGLE SHEET...";
        const res = await fetch(CONFIG_APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ channels: schedule })
        });
        const data = await res.json();
        if (data.status === "success") {
          streamStatusEl.innerText = `SHEET SYNCED (${data.count} CHANNELS)`;
        } else {
          streamStatusEl.innerText = "SYNC FAILED: " + (data.message || "Unknown error");
        }
        setTimeout(evaluateSchedule, 3000);
      } catch (err) {
        console.error("Sync error:", err);
        streamStatusEl.innerText = "OFFLINE - LOCAL STORAGE SAVED";
        setTimeout(evaluateSchedule, 3000);
      }
    }

    async function loadScheduleFromSheet() {
      if (!CONFIG_APPS_SCRIPT_URL) return;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3500);

      try {
        const res = await fetch(CONFIG_APPS_SCRIPT_URL, { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();
        if (data && data.channels && data.channels.length > 0) {
          schedule = data.channels;
          saveScheduleData();
          evaluateSchedule();
        }
      } catch (err) {
        console.warn("Using persistent local schedule:", err.message);
      }
    }

    document.getElementById("init-btn").addEventListener("click", () => {
      document.getElementById("start-overlay").style.display = "none";

      try {
        const elem = document.documentElement;
        if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen().catch(() => {});
      } catch (e) {}

      initializeScheduleData();
      initStereoAudioEngine();

      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }

      renderRemoteList();
      evaluateSchedule();

      loadScheduleFromSheet();
      setInterval(evaluateSchedule, 5000);
    });
