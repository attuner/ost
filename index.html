<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Online Sound Tracks</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- PWA & Mobile Web App Capabilities -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#181824" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Online Sound Tracks" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%231e293b'/%3E%3Ctext x='96' y='122' fill='%2360a5fa' font-family='sans-serif' font-weight='900' font-size='66' text-anchor='middle'%3EOST%3C/text%3E%3C/svg%3E" />

  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #030712;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.12);
      --focus-ring: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      inset: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* FULL-SCREEN CANVAS STAGE */
    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
    }

    #visualizer-canvas {
      position: absolute;
      bottom: 20%;
      
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* FLOATING CENTRAL CONTROL POD */
    #center-overlay {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(380px, 86vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 10;
      pointer-events: auto;
      gap: 12px;
    }

    .tuner-glass {
      background: rgba(15, 23, 42, 0.78);
      border: 1.5px solid rgba(59, 130, 246, 0.35);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(59, 130, 246, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      width: 100%;
    }

    .badge {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: #93c5fd;
      font-weight: 800;
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    #station-title {
      font-size: clamp(1.1rem, 2.5vw, 1.45rem);
      font-weight: 700;
      margin: 4px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #60a5fa;
    }

    #station-meta {
      font-size: clamp(0.72rem, 1.2vw, 0.82rem);
      color: var(--text-muted);
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.72rem;
      color: #cbd5e1;
      margin-top: 8px;
    }

    .db-meter-track {
      width: 100%;
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .db-meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981 0%, #f59e0b 70%, #ef4444 100%);
      transition: width 0.08s ease-out;
    }

    /* CONTROL ACTIONS */
    .control-actions {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.82rem;
      transition: background 0.15s, transform 0.05s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:focus, .btn:focus-visible {
      outline: 2px solid var(--focus-ring);
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: rgba(30, 41, 59, 0.8);
      color: #f1f5f9;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: rgba(51, 65, 85, 0.9); }
    .btn-cancel { background: #475569; color: #fff; }

    /* TIMETABLE DRAWER WITH TV SCROLL CONTROLS */
    #remote-drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      right: -560px;
      width: min(480px, 100vw);
      height: 100%;
      height: 100dvh;
      background: #0f172a;
      border-left: 1px solid var(--border);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #remote-drawer.open { right: 0; }

    .remote-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #1e293b;
    }

    .tv-scroll-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .tv-scroll-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tv-scroll-btn:focus, .tv-scroll-btn:focus-visible, .tv-scroll-btn:hover {
      outline: 2px solid var(--focus-ring);
      background: #475569;
    }

    .remote-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .station-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .station-item {
      background: #1e293b;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: 8px;
    }

    .station-item:focus, .station-item:focus-visible {
      outline: 2px solid var(--focus-ring);
      background: #334155;
    }

    .station-item.active {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.22);
    }

    .station-info h4 { font-size: 0.88rem; margin-bottom: 2px; }
    .station-info span { font-size: 0.7rem; color: var(--text-muted); }

    /* EDIT POPUP MODAL */
    #edit-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 120;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .modal-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 18px;
      width: min(440px, 95vw);
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      max-height: 94dvh;
      overflow-y: auto;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
      text-align: left;
    }

    .input-group label { font-size: 0.72rem; color: var(--text-muted); }
    .input-group input, .input-group select {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 150;
      padding: 16px;
    }
  </style>
</head>
<body>
<canvas id="visualizer-canvas"></canvas>
  <!-- STAGE WITH FULL-SCREEN CANVAS & FLOATING CENTER INTERFACE -->
  <div id="stage">
    
    <div id="center-overlay">
      <div class="tuner-glass">
        <span class="badge" id="stream-status">AUTOPILOT SCHEDULER</span>
        <h2 id="station-title">Online Sound Tracks</h2>
        <p id="station-meta">Synchronizing schedule...</p>
        <div class="telemetry-row">
          <span>LEVEL:</span>
          <span id="level-db-txt">-∞ dB</span>
        </div>
        <div class="db-meter-track">
          <div class="db-meter-fill" id="level-db-fill"></div>
        </div>
      </div>

      <div class="control-actions">
        <button class="btn btn-primary" style="flex:1;" onclick="openAddPopup()">+ Add Station</button>
        <button class="btn btn-secondary" onclick="toggleRemote()">Timetable</button>
        <button class="btn btn-secondary" onclick="syncWithGoogleSheet()">Sync Sheet</button>
      </div>
    </div>
  </div>

  <!-- POPUP EDIT / ADD MODAL -->
  <div id="edit-popup-overlay">
    <div class="modal-box">
      <h3 id="popup-heading" style="margin-bottom: 12px;">Edit Radio Station</h3>
      <form id="popup-form" onsubmit="handlePopupSubmit(event)">
        <input type="hidden" id="pop-index" value="-1" />
        
        <div style="display:flex; gap: 8px;">
          <div class="input-group" style="flex:1;">
            <label>Start Time (HH:mm)</label>
            <input type="text" id="pop-start" placeholder="08:00" required pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" />
          </div>
          <div class="input-group" style="flex:1;">
            <label>End Time (HH:mm)</label>
            <input type="text" id="pop-end" placeholder="12:00" required pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" />
          </div>
        </div>

        <div class="input-group">
          <label>Station Name</label>
          <input type="text" id="pop-title" placeholder="e.g. BBC World Service" required />
        </div>

        <div style="display:flex; gap: 8px;">
          <div class="input-group" style="flex:1;">
            <label>Category</label>
            <select id="pop-category">
              <option value="News">News</option>
              <option value="Learning">Learning & Talks</option>
              <option value="Entertainment">Entertainment & Music</option>
              <option value="Kids">Kids & Youth</option>
            </select>
          </div>
          <div class="input-group" style="flex:1;">
            <label>Language</label>
            <input type="text" id="pop-lang" placeholder="e.g. English / Telugu" />
          </div>
        </div>

        <div class="input-group">
          <label>Stream URL (.mp3, .aac, .m3u8)</label>
          <input type="url" id="pop-url" placeholder="https://..." required />
        </div>

        <div style="display:flex; gap: 8px; margin-top: 14px;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Save Station</button>
          <button type="button" class="btn btn-cancel" onclick="closePopup()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TIMETABLE DRAWER WITH TV SCROLL CONTROLS -->
  <div id="remote-drawer">
    <div class="remote-header">
      <h3 style="font-size: 1rem;">Station Timetable</h3>
      <div class="tv-scroll-controls">
        <button type="button" class="tv-scroll-btn" onclick="scrollTimetable(-220)" title="Scroll Up">▲ Up</button>
        <button type="button" class="tv-scroll-btn" onclick="scrollTimetable(220)" title="Scroll Down">▼ Down</button>
        <button type="button" class="btn btn-secondary" onclick="toggleRemote()">✕</button>
      </div>
    </div>
    <div class="remote-content" id="timetable-scroll-area">
      <div class="station-list" id="remote-station-list"></div>
    </div>
  </div>

  <audio id="radio-core" crossorigin="anonymous" preload="auto" playsinline></audio>

  <div id="start-overlay">
    <button class="btn btn-primary" style="padding: 16px 32px; font-size: 1.05rem;" id="init-btn">
      Start Online Sound Tracks
    </button>
  </div>

  <script>
    const CONFIG_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqe4F6QNKSSyas9pGIw_837dajzRIvB0-TQ-pnbN5lEYdh_z-v_zDVVhoIaEifh2Xc9Q/exec";
    const STORAGE_KEY = "online_sound_tracks_v1";

    const DEFAULT_SCHEDULE = [
            { startTime: "05:40", endTime: "06:00", title: "BBC World Service", category: "News", language: "English", url: "https://stream.live.vc.bbcmedia.co.uk/bbc_world_service" }
    ];

    let schedule = [];
    let activeChannel = null;
    let manualOverride = false;
    let hlsInstance = null;
    let isPlaying = false;

    // Web Audio API State
    let audioCtx = null;
    let audioSource = null;
    let analyserNode = null;
    let freqDataArray = null;
    let hasWebAudio = false;

    const audio = document.getElementById("radio-core");
    const stationTitleEl = document.getElementById("station-title");
    const stationMetaEl = document.getElementById("station-meta");
    const streamStatusEl = document.getElementById("stream-status");
    const levelDbTxt = document.getElementById("level-db-txt");
    const levelDbFill = document.getElementById("level-db-fill");
    const remoteDrawer = document.getElementById("remote-drawer");
    const remoteList = document.getElementById("remote-station-list");
    const popupOverlay = document.getElementById("edit-popup-overlay");
    const scrollContainer = document.getElementById("timetable-scroll-area");
    const canvas = document.getElementById("visualizer-canvas");
    const ctx = canvas.getContext("2d");

    function initializeScheduleData() {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        try {
          schedule = JSON.parse(cached);
          if (schedule.length > 0) return;
        } catch (e) {
          console.warn("Storage parse error:", e);
        }
      }
      schedule = [...DEFAULT_SCHEDULE];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
    }

    function saveScheduleData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
      renderRemoteList();
    }

    function scrollTimetable(offset) {
      if (scrollContainer) {
        scrollContainer.scrollBy({ top: offset, behavior: "smooth" });
      }
    }

    // CANVAS SIZING FOR RETINA / HIGH-DPI & FULL SCREEN
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 200));

    // WEB AUDIO API ANALYSER INITIALIZATION
    function setupWebAudio() {
      if (hasWebAudio) return;
      try {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtxClass();

        audioSource = audioCtx.createMediaElementSource(audio);
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 128;
        analyserNode.smoothingTimeConstant = 0.82;

        freqDataArray = new Uint8Array(analyserNode.frequencyBinCount);

        audioSource.connect(analyserNode);
        analyserNode.connect(audioCtx.destination);

        hasWebAudio = true;
      } catch (e) {
        console.warn("Web Audio Analyser init deferred / restricted:", e);
      }
    }

    // STRAIGHT HORIZONTAL FREQUENCY SPECTRUM VISUALIZER
    function startRadialVisualizerLoop() {
      resizeCanvas();

      function renderFrame() {
        requestAnimationFrame(renderFrame);

        const width = window.innerWidth;
        const height = window.innerHeight;
        ctx.clearRect(0, 0, width, height);

        let rms = 0;
        let binsCount = 64;
        let data = freqDataArray;

        if (hasWebAudio && analyserNode && isPlaying) {
          analyserNode.getByteFrequencyData(freqDataArray);
          binsCount = analyserNode.frequencyBinCount;
          data = freqDataArray;

          let sum = 0;
          for (let i = 0; i < binsCount; i++) {
            sum += data[i] * data[i];
          }
          rms = Math.sqrt(sum / binsCount);
        } else if (isPlaying) {
          // Fallback data if stream is strictly cross-origin restricted
          rms = 48 + Math.random() * 24;
          data = new Uint8Array(binsCount);
          for (let i = 0; i < binsCount; i++) {
            data[i] = Math.round(50 + Math.sin(i * 0.2 + Date.now() * 0.005) * 45);
          }
        }

        // Telemetry calculation
        const db = isPlaying && rms > 0 ? Math.max(-60, Math.round(20 * Math.log10(rms / 255))) : -60;
        levelDbTxt.innerText = db > -60 ? `${db} dB` : "-∞ dB";
        levelDbFill.style.width = `${Math.min(100, Math.max(0, (db + 60) * 1.66))}%`;

        // Render Straight Horizontal Equalizer Bars
        const barSpacing = 2;
        const totalSpacing = barSpacing * (binsCount - 1);
        const barWidth = Math.max(1, (width - totalSpacing) / binsCount);
        const maxBarHeight = height * 0.35;

        for (let i = 0; i < binsCount; i++) {
          const amplitude = isPlaying && data ? data[i] / 255 : 0;
          const barHeight = Math.max(2, amplitude * maxBarHeight);
          const x = i * (barWidth + barSpacing);
          const y = height - barHeight;

          const opacity = isPlaying ? Math.max(0.2, amplitude * 0.9) : 0.08;
          ctx.fillStyle = `rgba(59, 130, 246, ${opacity})`;
          ctx.fillRect(x, y, barWidth, barHeight);
        }

        // Horizontal Baseline Decorative Line
        ctx.beginPath();
        ctx.moveTo(0, height - 1);
        ctx.lineTo(width, height - 1);
        ctx.strokeStyle = isPlaying ? "rgba(59, 130, 246, 0.4)" : "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      renderFrame();
    }

    function toMinutes(t) {
      if (!t) return 0;
      const parts = t.toString().trim().split(":");
      return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    }

    function getScheduledChannel() {
      const now = new Date();
      const current = now.getHours() * 60 + now.getMinutes();

      return schedule.find(item => {
        const start = toMinutes(item.startTime);
        const end = toMinutes(item.endTime);
        if (start < end) return current >= start && current < end;
        if (start > end) return current >= start || current < end;
        return true;
      }) || schedule[0];
    }

    function playStream(station, isManual = false) {
      if (!station) return;
      activeChannel = station;
      manualOverride = isManual;

      stationTitleEl.innerText = station.title;
      stationMetaEl.innerText = `${station.startTime} - ${station.endTime} | ${station.category || "General"} | ${station.language || "English"}`;
      streamStatusEl.innerText = isManual ? "MANUAL OVERRIDE" : "AUTOPILOT SCHEDULER";

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      audio.pause();
      audio.removeAttribute("src");
      audio.load();

      let streamUrl = station.url.trim();
      if (location.protocol === "https:" && streamUrl.startsWith("http://")) {
        streamUrl = streamUrl.replace("http://", "https://");
      }

      if (streamUrl.includes(".m3u8") && audio.canPlayType("application/vnd.apple.mpegurl")) {
        audio.src = streamUrl;
        audio.play().catch(e => console.warn("Native HLS play pending gesture:", e));
      } else if (streamUrl.includes(".m3u8") && Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(audio);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          audio.play().catch(e => console.warn("HLS play pending gesture:", e));
        });
      } else {
        audio.src = streamUrl;
        audio.play().catch(e => console.warn("Native stream play pending gesture:", e));
      }

      renderRemoteList();
    }

    audio.addEventListener("playing", () => {
      isPlaying = true;
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      streamStatusEl.innerText = manualOverride ? "MANUAL OVERRIDE (PLAYING)" : "AUTOPILOT (PLAYING)";
    });

    audio.addEventListener("pause", () => { isPlaying = false; });
    audio.addEventListener("waiting", () => { streamStatusEl.innerText = "BUFFERING STREAM..."; });
    audio.addEventListener("error", (e) => {
      console.warn("Direct stream error:", e);
      isPlaying = false;
      streamStatusEl.innerText = "STREAM OFFLINE / UNREACHABLE";
    });

    function evaluateSchedule() {
      if (manualOverride) return;
      const scheduled = getScheduledChannel();
      if (scheduled && (!activeChannel || activeChannel.url !== scheduled.url)) {
        playStream(scheduled, false);
      }
    }

    function openAddPopup() {
      document.getElementById("popup-heading").innerText = "Add Radio Station";
      document.getElementById("pop-index").value = "-1";
      document.getElementById("popup-form").reset();
      popupOverlay.style.display = "flex";
    }

    function openEditPopup(index) {
      const station = schedule[index];
      document.getElementById("popup-heading").innerText = `Edit: ${station.title}`;
      document.getElementById("pop-index").value = index;
      document.getElementById("pop-start").value = station.startTime;
      document.getElementById("pop-end").value = station.endTime;
      document.getElementById("pop-title").value = station.title;
      document.getElementById("pop-category").value = station.category || "News";
      document.getElementById("pop-lang").value = station.language || "English";
      document.getElementById("pop-url").value = station.url;
      popupOverlay.style.display = "flex";
    }

    function closePopup() {
      popupOverlay.style.display = "none";
    }

    function handlePopupSubmit(e) {
      e.preventDefault();
      const editIdx = parseInt(document.getElementById("pop-index").value, 10);
      const stationData = {
        startTime: document.getElementById("pop-start").value.trim(),
        endTime: document.getElementById("pop-end").value.trim(),
        title: document.getElementById("pop-title").value.trim(),
        category: document.getElementById("pop-category").value,
        language: document.getElementById("pop-lang").value.trim(),
        url: document.getElementById("pop-url").value.trim()
      };

      if (editIdx >= 0) {
        schedule[editIdx] = stationData;
      } else {
        schedule.push(stationData);
      }

      schedule.sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
      saveScheduleData();
      closePopup();
      evaluateSchedule();
    }

    function removeStation(index) {
      schedule.splice(index, 1);
      saveScheduleData();
    }

    function toggleRemote() {
      remoteDrawer.classList.toggle("open");
    }

    function renderRemoteList() {
      remoteList.innerHTML = "";
      schedule.forEach((item, index) => {
        const el = document.createElement("div");
        el.tabIndex = 0;
        el.className = `station-item ${activeChannel && activeChannel.url === item.url ? "active" : ""}`;
        el.innerHTML = `
          <div class="station-info" style="flex:1;">
            <h4>${item.title}</h4>
            <span>${item.startTime} - ${item.endTime} • ${item.category || ""} • ${item.language || ""}</span>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem;" onclick="event.stopPropagation(); openEditPopup(${index})">✏ Edit</button>
            <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem;" onclick="event.stopPropagation(); removeStation(${index})">✕</button>
          </div>
        `;
        el.onclick = () => playStream(item, true);
        el.onkeydown = (ev) => {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            playStream(item, true);
          }
        };
        remoteList.appendChild(el);
      });
    }

    async function syncWithGoogleSheet() {
      try {
        streamStatusEl.innerText = "SAVING TO GOOGLE SHEET...";
        const res = await fetch(CONFIG_APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ channels: schedule })
        });
        const data = await res.json();
        if (data.status === "success") {
          streamStatusEl.innerText = `SHEET SYNCED (${data.count} CHANNELS)`;
        } else {
          streamStatusEl.innerText = "SYNC FAILED: " + (data.message || "Unknown error");
        }
        setTimeout(evaluateSchedule, 3000);
      } catch (err) {
        console.error("Sync error:", err);
        streamStatusEl.innerText = "OFFLINE - LOCAL STORAGE SAVED";
        setTimeout(evaluateSchedule, 3000);
      }
    }

    async function loadScheduleFromSheet() {
      if (!CONFIG_APPS_SCRIPT_URL) return;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3500);

      try {
        const res = await fetch(CONFIG_APPS_SCRIPT_URL, { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();
        if (data && data.channels && data.channels.length > 0) {
          schedule = data.channels;
          saveScheduleData();
          evaluateSchedule();
        }
      } catch (err) {
        console.warn("Using persistent local schedule:", err.message);
      }
    }

    function initializePlaybackSystem() {
      document.getElementById("start-overlay").style.display = "none";

      try {
        const elem = document.documentElement;
        if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen().catch(() => {});
      } catch (e) {}

      initializeScheduleData();
      setupWebAudio();

      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }

      startRadialVisualizerLoop();
      renderRemoteList();
      evaluateSchedule();

      loadScheduleFromSheet();
      setInterval(evaluateSchedule, 5000);
    }

    const initBtn = document.getElementById("init-btn");
    initBtn.addEventListener("click", initializePlaybackSystem);
    initBtn.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.keyCode === 13) {
        initializePlaybackSystem();
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then((reg) => console.log("SW registered:", reg.scope))
          .catch((err) => console.warn("SW failed:", err));
      });
    }
  </script>
</body>
</html>
