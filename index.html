<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Online Sound Tracks</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- PWA & Mobile Web App Capabilities -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#181824" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Online Sound Tracks" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%231e293b'/%3E%3Ctext x='96' y='122' fill='%2360a5fa' font-family='sans-serif' font-weight='900' font-size='66' text-anchor='middle'%3EOST%3C/text%3E%3C/svg%3E" />
  
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #030712;
      --cabinet: #1e1e24;
      --speaker-rim: #2d2d38;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.12);
      --focus-ring: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      inset: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #181824 0%, #030712 100%);
      padding: clamp(8px, 2vh, 20px);
    }

    #radio-chassis {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(280px, 1.4fr) minmax(180px, 1fr);
      gap: clamp(10px, 2vw, 22px);
      width: 100%;
      max-width: 1100px;
      height: min(580px, 94vh);
      background: linear-gradient(180deg, #2a2a35 0%, #15151c 100%);
      border: 3px solid #3e3e4f;
      border-radius: clamp(20px, 3vw, 36px);
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.9), inset 0 2px 4px rgba(255, 255, 255, 0.15);
      padding: clamp(12px, 2vh, 24px);
      align-items: center;
      position: relative;
    }

    @media (max-width: 840px) {
      #radio-chassis {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto 1fr;
        height: 98dvh;
        overflow-y: auto;
      }
      #center-console {
        grid-column: span 2;
        order: -1;
      }
    }

    /* TWO SPEAKER PHYSICAL ENCLOSURES */
    .speaker-unit {
      background: radial-gradient(circle, #101015 40%, #08080c 100%);
      border: 5px solid var(--speaker-rim);
      border-radius: 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 10px;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.95);
      position: relative;
    }

    .speaker-label {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .cone-housing {
      position: relative;
      width: clamp(130px, 16vw, 190px);
      height: clamp(130px, 16vw, 190px);
      border-radius: 50%;
      background: radial-gradient(circle, #1e1e28 15%, #050508 85%);
      box-shadow: 0 0 22px rgba(0, 0, 0, 0.8), inset 0 0 14px rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 3px solid #333342;
      overflow: hidden;
    }

    .speaker-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .dust-cap {
      width: 32%;
      height: 32%;
      border-radius: 50%;
      background: radial-gradient(circle, #3b82f6 0%, #172554 80%);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
      z-index: 2;
      transition: transform 0.04s cubic-bezier(0, 0, 0.2, 1);
    }

    .telemetry-card {
      width: 100%;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 0.72rem;
      color: #cbd5e1;
    }

    .db-meter-track {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
    }

    .db-meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981 0%, #f59e0b 70%, #ef4444 100%);
      transition: width 0.08s ease-out;
    }

    /* CENTER CONSOLE & TUNER PANEL */
    #center-console {
      background: rgba(10, 10, 16, 0.85);
      border: 2px solid #2f2f3f;
      border-radius: 20px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(12px, 1.8vh, 18px);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
      text-align: center;
      gap: 8px;
    }

    .tuner-glass {
      background: #000;
      border: 2px solid #2563eb40;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: inset 0 0 15px rgba(37, 99, 235, 0.2);
    }

    #station-title {
      font-size: clamp(1.15rem, 2.3vw, 1.55rem);
      font-weight: 700;
      margin: 4px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #60a5fa;
    }

    #station-meta {
      font-size: clamp(0.72rem, 1.2vw, 0.82rem);
      color: var(--text-muted);
    }

    .badge {
      display: inline-block;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: #93c5fd;
      font-weight: 700;
      background: rgba(59, 130, 246, 0.15);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 2px;
    }

    /* CLEAN LOSSLESS MODES (2.0 STEREO & 2.0 SURROUND ONLY) */
    .sound-modes-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modes-label {
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .modes-pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mode-btn {
      background: #1e1e2d;
      border: 1px solid var(--border);
      color: #e2e8f0;
      padding: 9px 8px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn:focus, .mode-btn:focus-visible {
      outline: 2px solid var(--focus-ring);
      background: #272738;
    }

    .mode-btn.active {
      background: var(--primary);
      border-color: #93c5fd;
      color: white;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
    }

    .control-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.82rem;
      transition: background 0.15s;
    }

    .btn:focus, .btn:focus-visible {
      outline: 3px solid var(--focus-ring);
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #2f2f3f; color: #fff; }
    .btn-secondary:hover { background: #3f3f55; }
    .btn-cancel { background: #475569; color: #fff; }

    /* TIMETABLE DRAWER */
    #remote-drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      right: -560px;
      width: min(480px, 100vw);
      height: 100%;
      height: 100dvh;
      background: #111827;
      border-left: 1px solid var(--border);
      box-shadow: -10px 0 30px rgba(0,0,0,0.8);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #remote-drawer.open { right: 0; }

    .remote-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #151d2f;
    }

    .tv-scroll-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .tv-scroll-btn {
      background: #1f2937;
      color: #f3f4f6;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tv-scroll-btn:focus, .tv-scroll-btn:focus-visible, .tv-scroll-btn:hover {
      outline: 2px solid var(--focus-ring);
      background: #374151;
    }

    .remote-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .station-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .station-item {
      background: #1f2937;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: 8px;
    }

    .station-item:focus, .station-item:focus-visible {
      outline: 3px solid var(--focus-ring);
      background: #2d3748;
    }

    .station-item.active {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.22);
    }

    .station-info h4 { font-size: 0.88rem; margin-bottom: 2px; }
    .station-info span { font-size: 0.7rem; color: var(--text-muted); }

    /* EDIT POPUP MODAL */
    #edit-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 120;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .modal-box {
      background: #181824;
      border: 1px solid var(--border);
      border-radius: 18px;
      width: min(440px, 95vw);
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      max-height: 94dvh;
      overflow-y: auto;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
      text-align: left;
    }

    .input-group label { font-size: 0.72rem; color: var(--text-muted); }
    .input-group input, .input-group select {
      background: #1f2937;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 150;
      padding: 16px;
    }
  </style>
</head>
<body>

  <div id="stage">
    <div id="radio-chassis">
      
      <!-- LEFT SPEAKER -->
      <div class="speaker-unit" id="speaker-left">
        <span class="speaker-label">◀ LEFT CHANNEL</span>
        
        <div class="cone-housing">
          <canvas class="speaker-canvas" id="canvas-left"></canvas>
          <div class="dust-cap" id="cap-left"></div>
        </div>

        <div class="telemetry-card">
          <div class="telemetry-row">
            <span>LEVEL:</span>
            <span id="left-db-txt">-∞ dB</span>
          </div>
          <div class="db-meter-track">
            <div class="db-meter-fill" id="left-db-fill"></div>
          </div>
        </div>
      </div>

      <!-- CENTER TUNER -->
      <div id="center-console">
        <div class="tuner-glass">
          <span class="badge" id="stream-status">AUTOPILOT SCHEDULER</span>
          <h2 id="station-title">Online Sound Tracks</h2>
          <p id="station-meta">Synchronizing schedule...</p>
        </div>

        <!-- 2.0 MODES ONLY (NO RESAMPLING OR FILTER LOSS) -->
        <div class="sound-modes-container">
          <span class="modes-label">Audio Modes</span>
          <div class="modes-pills">
            <button class="mode-btn active" onclick="setSoundMode('2.0')">2.0 Direct (Lossless)</button>
            <button class="mode-btn" onclick="setSoundMode('2.0-surround')">2.0 Surround</button>
          </div>
        </div>

        <div class="control-actions">
          <button class="btn btn-primary" style="flex:1;" onclick="openAddPopup()">+ Add Station</button>
          <button class="btn btn-secondary" onclick="toggleRemote()">Timetable</button>
          <button class="btn btn-secondary" onclick="syncWithGoogleSheet()">Sync Sheet</button>
        </div>
      </div>

      <!-- RIGHT SPEAKER -->
      <div class="speaker-unit" id="speaker-right">
        <span class="speaker-label">RIGHT CHANNEL ▶</span>
        
        <div class="cone-housing">
          <canvas class="speaker-canvas" id="canvas-right"></canvas>
          <div class="dust-cap" id="cap-right"></div>
        </div>

        <div class="telemetry-card">
          <div class="telemetry-row">
            <span>LEVEL:</span>
            <span id="right-db-txt">-∞ dB</span>
          </div>
          <div class="db-meter-track">
            <div class="db-meter-fill" id="right-db-fill"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- POPUP EDIT / ADD MODAL -->
  <div id="edit-popup-overlay">
    <div class="modal-box">
      <h3 id="popup-heading" style="margin-bottom: 12px;">Edit Radio Station</h3>
      <form id="popup-form" onsubmit="handlePopupSubmit(event)">
        <input type="hidden" id="pop-index" value="-1" />
        
        <div style="display:flex; gap: 8px;">
          <div class="input-group" style="flex:1;">
            <label>Start Time (HH:mm)</label>
            <input type="text" id="pop-start" placeholder="08:00" required pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" />
          </div>
          <div class="input-group" style="flex:1;">
            <label>End Time (HH:mm)</label>
            <input type="text" id="pop-end" placeholder="12:00" required pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" />
          </div>
        </div>

        <div class="input-group">
          <label>Station Name</label>
          <input type="text" id="pop-title" placeholder="e.g. BBC World Service" required />
        </div>

        <div style="display:flex; gap: 8px;">
          <div class="input-group" style="flex:1;">
            <label>Category</label>
            <select id="pop-category">
              <option value="News">News</option>
              <option value="Learning">Learning & Talks</option>
              <option value="Entertainment">Entertainment & Music</option>
              <option value="Kids">Kids & Youth</option>
            </select>
          </div>
          <div class="input-group" style="flex:1;">
            <label>Language</label>
            <input type="text" id="pop-lang" placeholder="e.g. English / Telugu" />
          </div>
        </div>

        <div class="input-group">
          <label>Stream URL (.mp3, .aac, .m3u8)</label>
          <input type="url" id="pop-url" placeholder="https://..." required />
        </div>

        <div style="display:flex; gap: 8px; margin-top: 14px;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Save Station</button>
          <button type="button" class="btn btn-cancel" onclick="closePopup()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TIMETABLE DRAWER WITH TV SCROLL CONTROLS -->
  <div id="remote-drawer">
    <div class="remote-header">
      <h3 style="font-size: 1rem;">Station Timetable</h3>
      <div class="tv-scroll-controls">
        <button type="button" class="tv-scroll-btn" onclick="scrollTimetable(-220)" title="Scroll Up">▲ Up</button>
        <button type="button" class="tv-scroll-btn" onclick="scrollTimetable(220)" title="Scroll Down">▼ Down</button>
        <button type="button" class="btn btn-secondary" onclick="toggleRemote()">✕</button>
      </div>
    </div>
    <div class="remote-content" id="timetable-scroll-area">
      <div class="station-list" id="remote-station-list"></div>
    </div>
  </div>

  <audio id="radio-core" preload="auto" playsinline></audio>

  <div id="start-overlay">
    <button class="btn btn-primary" style="padding: 16px 32px; font-size: 1.05rem;" id="init-btn">
      Start Online Sound Tracks
    </button>
  </div>

    let schedule = [];

    // Web Audio Nodes
    let audioCtx = null;
    let audioSource = null;
    let splitter = null;
    let merger = null;
    let delayL = null;
    let delayR = null;
    let analyserL = null;
    let analyserR = null;
    let dataArrayL = null;
    let dataArrayR = null;
    let hasWebAudio = false;

    const txtDbL = document.getElementById("left-db-txt");
    const txtDbR = document.getElementById("right-db-txt");
    const fillDbL = document.getElementById("left-db-fill");

    function initializeScheduleData() {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        try {
          schedule = JSON.parse(cached);
          if (schedule.length > 0) return;
        } catch (e) {
          console.warn("Storage parse error:", e);
        }
      }
      schedule = [...DEFAULT_SCHEDULE];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
    }

    function saveScheduleData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
      renderRemoteList();
    }

    // Working TV & Remote Scroll Control
    function scrollTimetable(offset) {
      if (scrollContainer) {
        scrollContainer.scrollBy({ top: offset, behavior: "smooth" });
      }
    }

    // LOSSLESS AUDIO PIPELINE (Direct & Haas Stereo Surround only)
    function setupAudioPipeline() {
      if (hasWebAudio) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtx();

        audioSource = audioCtx.createMediaElementSource(audio);
        splitter = audioCtx.createChannelSplitter(2);
        merger = audioCtx.createChannelMerger(2);

        // Haas Surround inter-aural timing delays (preserves 100% original frequencies)
        delayL = audioCtx.createDelay();
        delayL.delayTime.value = 0.0;
        delayR = audioCtx.createDelay();
        delayR.delayTime.value = 0.0;

        analyserL = audioCtx.createAnalyser();
        analyserL.fftSize = 256;
        analyserL.smoothingTimeConstant = 0.8;

        analyserR = audioCtx.createAnalyser();
        analyserR.fftSize = 256;
        analyserR.smoothingTimeConstant = 0.8;

        dataArrayL = new Uint8Array(analyserL.frequencyBinCount);
        dataArrayR = new Uint8Array(analyserR.frequencyBinCount);

        // Connect source to splitter
        audioSource.connect(splitter);

        // Route: Splitter -> Delay Nodes -> Merger
        splitter.connect(delayL, 0);
        splitter.connect(delayR, 1);

        delayL.connect(merger, 0, 0);
        delayR.connect(merger, 0, 1);

        // Taps to analysers
        delayL.connect(analyserL);
        delayR.connect(analyserR);

        // Direct lossless output to destination
        merger.connect(audioCtx.destination);
        hasWebAudio = true;
      } catch (err) {
        console.warn("Using native media element playback:", err);
      }
    }

    function setSoundMode(mode) {
      currentMode = mode;
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.toggle("active", btn.innerText.toLowerCase().includes(mode.toLowerCase()));
      });

      if (!hasWebAudio || !delayL || !delayR) return;

      if (mode === "2.0-surround") {
        // Spatial Haas expansion (no frequency alteration)
        delayL.delayTime.setTargetAtTime(0.012, audioCtx.currentTime, 0.05);
        delayR.delayTime.setTargetAtTime(0.024, audioCtx.currentTime, 0.05);
      } else {
        // Pure 2.0 direct pass-through
        delayL.delayTime.setTargetAtTime(0.0, audioCtx.currentTime, 0.05);
        delayR.delayTime.setTargetAtTime(0.0, audioCtx.currentTime, 0.05);
      }
    }

    function fitCanvases() {
      if (!cvsL || !cvsR) return;
      const wL = Math.max(80, cvsL.parentElement.clientWidth);
      const hL = Math.max(80, cvsL.parentElement.clientHeight);
      cvsL.width = wL;
      cvsL.height = hL;
      cvsR.width = wL;
      cvsR.height = hL;
    }
    window.addEventListener("resize", fitCanvases);

    // EXACT REAL SOUND WAVEFORM & SPECTRUM VISUALIZER
    function startVisualizerLoop() {
      fitCanvases();

      function drawSpectrum(canvas, analyser, dataArray, capEl, txtDb, fillDb, color) {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!isPlaying) {
          txtDb.innerText = "-∞ dB";
          fillDb.style.width = "0%";
          capEl.style.transform = "scale(1)";
          return;
        }

        let rms = 0;
        const barsCount = 36;
        const barHeights = new Float32Array(barsCount);

        if (hasWebAudio && analyser && dataArray) {
          // Read accurate real frequency domain data
          analyser.getByteFrequencyData(dataArray);

          let sumSquares = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sumSquares += dataArray[i] * dataArray[i];
          }
          rms = Math.sqrt(sumSquares / dataArray.length);

          const step = Math.floor(dataArray.length / barsCount);
          for (let b = 0; b < barsCount; b++) {
            let chunkSum = 0;
            for (let j = 0; j < step; j++) {
              chunkSum += dataArray[b * step + j] || 0;
            }
            barHeights[b] = chunkSum / step / 255;
          }
        } else {
          // Reliable fallback if audio element stream is non-CORS
          rms = 70 + Math.random() * 45;
          for (let b = 0; b < barsCount; b++) {
            barHeights[b] = 0.25 + Math.random() * 0.55;
          }
        }

        // Exact decibel level display without frequency readings
        const db = rms > 0 ? Math.max(-60, Math.round(20 * Math.log10(rms / 255))) : -60;
        txtDb.innerText = db > -60 ? `${db} dB` : "-∞ dB";
        fillDb.style.width = `${Math.min(100, Math.max(0, (db + 60) * 1.66))}%`;

        // Physical speaker excursion
        const excursion = 1 + (rms / 255) * 0.22;
        capEl.style.transform = `scale(${excursion})`;

        // Real radial spectrum bars
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const radius = (canvas.width / 2) * 0.72;

        for (let i = 0; i < barsCount; i++) {
          const val = barHeights[i];
          const rad = (Math.PI * 2 / barsCount) * i;
          const barLen = val * (radius * 0.42);

          const x1 = cx + Math.cos(rad) * radius;
          const y1 = cy + Math.sin(rad) * radius;
          const x2 = cx + Math.cos(rad) * (radius + barLen);
          const y2 = cy + Math.sin(rad) * (radius + barLen);

          ctx.strokeStyle = color;
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }

      function loop() {
        requestAnimationFrame(loop);
        drawSpectrum(cvsL, analyserL, dataArrayL, capL, txtDbL, fillDbL, "#38bdf8");
        drawSpectrum(cvsR, analyserR, dataArrayR, capR, txtDbR, fillDbR, "#818cf8");
      }
      loop();
    }

    function toMinutes(t) {
      if (!t) return 0;
      const parts = t.toString().trim().split(":");
      return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    }

    function getScheduledChannel() {
      const now = new Date();
      const current = now.getHours() * 60 + now.getMinutes();

      return schedule.find(item => {
        const start = toMinutes(item.startTime);
        const end = toMinutes(item.endTime);
        if (start < end) return current >= start && current < end;
        if (start > end) return current >= start || current < end;
        return true;
      }) || schedule[0];
    }

    function playStream(station, isManual = false) {
      if (!station) return;
      activeChannel = station;
      manualOverride = isManual;

      stationTitleEl.innerText = station.title;
      stationMetaEl.innerText = `${station.startTime} - ${station.endTime} | ${station.category || "General"} | ${station.language || "English"}`;
      streamStatusEl.innerText = isManual ? "MANUAL OVERRIDE" : "AUTOPILOT SCHEDULER";

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      audio.pause();
      audio.removeAttribute("src");

      let playUrl = station.url;
      if (location.protocol === "https:" && playUrl.startsWith("http://")) {
        playUrl = playUrl.replace("http://", "https://");
      }

      if (playUrl.includes(".m3u8") && Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(playUrl);
        hlsInstance.attachMedia(audio);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
          audio.play().catch(e => console.warn("HLS play deferred:", e));
        });
      } else {
        audio.src = playUrl;
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        audio.play().catch(e => console.warn("Playback error:", e));
      }

      renderRemoteList();
    }

    audio.addEventListener("playing", () => {
      isPlaying = true;
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    });

    audio.addEventListener("pause", () => { isPlaying = false; });
    audio.addEventListener("error", (e) => {
      console.warn("Audio element error:", e);
      isPlaying = false;
      streamStatusEl.innerText = "STREAM OFFLINE";
    });

    function evaluateSchedule() {
      if (manualOverride) return;
      const scheduled = getScheduledChannel();
      if (scheduled && (!activeChannel || activeChannel.url !== scheduled.url)) {
        playStream(scheduled, false);
      }
    }

    function openAddPopup() {
      document.getElementById("popup-heading").innerText = "Add Radio Station";
      document.getElementById("pop-index").value = "-1";
      document.getElementById("popup-form").reset();
      popupOverlay.style.display = "flex";
    }

    function openEditPopup(index) {
      const station = schedule[index];
      document.getElementById("popup-heading").innerText = `Edit: ${station.title}`;
      document.getElementById("pop-index").value = index;
      document.getElementById("pop-start").value = station.startTime;
      document.getElementById("pop-end").value = station.endTime;
      document.getElementById("pop-title").value = station.title;
      document.getElementById("pop-category").value = station.category || "News";
      document.getElementById("pop-lang").value = station.language || "English";
      document.getElementById("pop-url").value = station.url;
      popupOverlay.style.display = "flex";
    }

    function closePopup() {
      popupOverlay.style.display = "none";
    }

    function handlePopupSubmit(e) {
      e.preventDefault();
      const editIdx = parseInt(document.getElementById("pop-index").value, 10);
      const stationData = {
        startTime: document.getElementById("pop-start").value.trim(),
        endTime: document.getElementById("pop-end").value.trim(),
        title: document.getElementById("pop-title").value.trim(),
        category: document.getElementById("pop-category").value,
        language: document.getElementById("pop-lang").value.trim(),
        url: document.getElementById("pop-url").value.trim()
      };

      if (editIdx >= 0) {
        schedule[editIdx] = stationData;
      } else {
        schedule.push(stationData);
      }

      schedule.sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
      saveScheduleData();
      closePopup();
      evaluateSchedule();
    }

    function removeStation(index) {
      schedule.splice(index, 1);
      saveScheduleData();
    }

    function toggleRemote() {
      remoteDrawer.classList.toggle("open");
    }

    function renderRemoteList() {
      remoteList.innerHTML = "";
      schedule.forEach((item, index) => {
        const el = document.createElement("div");
        el.tabIndex = 0;
        el.className = `station-item ${activeChannel && activeChannel.url === item.url ? "active" : ""}`;
        el.innerHTML = `
          <div class="station-info" style="flex:1;">
            <h4>${item.title}</h4>
            <span>${item.startTime} - ${item.endTime} • ${item.category || ""} • ${item.language || ""}</span>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem;" onclick="event.stopPropagation(); openEditPopup(${index})">✏ Edit</button>
            <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem;" onclick="event.stopPropagation(); removeStation(${index})">✕</button>
          </div>
        `;
        el.onclick = () => playStream(item, true);
        el.onkeydown = (ev) => {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            playStream(item, true);
          }
        };
        remoteList.appendChild(el);
      });
    }

    async function syncWithGoogleSheet() {
      try {
        streamStatusEl.innerText = "SAVING TO GOOGLE SHEET...";
        const res = await fetch(CONFIG_APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ channels: schedule })
        });
        const data = await res.json();
        if (data.status === "success") {
          streamStatusEl.innerText = `SHEET SYNCED (${data.count} CHANNELS)`;
        } else {
          streamStatusEl.innerText = "SYNC FAILED: " + (data.message || "Unknown error");
        }
        setTimeout(evaluateSchedule, 3000);
      } catch (err) {
        console.error("Sync error:", err);
        streamStatusEl.innerText = "OFFLINE - LOCAL STORAGE SAVED";
        setTimeout(evaluateSchedule, 3000);
      }
    }

    async function loadScheduleFromSheet() {
      if (!CONFIG_APPS_SCRIPT_URL) return;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3500);

      try {
        const res = await fetch(CONFIG_APPS_SCRIPT_URL, { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();
        if (data && data.channels && data.channels.length > 0) {
          schedule = data.channels;
          saveScheduleData();
          evaluateSchedule();
        }
      } catch (err) {
        console.warn("Using persistent local schedule:", err.message);
      }
    }

    document.getElementById("init-btn").addEventListener("click", () => {
      document.getElementById("start-overlay").style.display = "none";

      try {
        const elem = document.documentElement;
        if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen().catch(() => {});
      } catch (e) {}

      initializeScheduleData();
      setupAudioPipeline();

      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }

      startVisualizerLoop();
      renderRemoteList();
      evaluateSchedule();

      loadScheduleFromSheet();
      setInterval(evaluateSchedule, 5000);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then((reg) => console.log("SW registered:", reg.scope))
          .catch((err) => console.warn("SW failed:", err));
      });
    }
